[pytest]
; Each function lives in its own directory, and the test files import flat
; (e.g. `from receive_contribution import receive_contribution`). Listing the
; directories here makes that explicit rather than relying on pytest inserting
; each test file's own directory into sys.path implicitly.
pythonpath =
    "Function 1: Receive Contribution"
    "Function 2: Calculate Interest"
    "Function 3: Categorise Transaction"
    "Function 4: Transfer Funds"
    "Function 5: Apply Transaction"
    "Function 6: Process Batch Transactions"

; Pinned deliberately: if a future pytest defaults to importlib, the implicit
; sys.path insertion disappears and every test file breaks at once.
addopts = --import-mode=prepend

norecursedirs = .git .venv venv __pycache__ .pristine baseline break-results leaderboard buggy

name: Score

# Runs on every push to a student branch. Posts coverage to the leaderboard
# immediately, then runs the student's tests against 30 broken versions of the
# six functions and posts the break-detection scores.
#
# Required secrets:  LEADERBOARD_URL, LEADERBOARD_API_KEY, BUGGY_REPO_DEPLOY_KEY, LEADERBOARD_DEPLOY_KEY
# Optional vars:     PROJECT_ID, PIPELINE_REF, BUGGY_REPO, LEADERBOARD_REPO

on:
  push:
    branches-ignore:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      student:
        description: 'Override the student name (defaults to the branch name)'
        required: false

# Students push frequently. Without this, each push queues another 37 pytest
# runs behind the last one.
concurrency:
  group: score-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  score:
    # Forks never receive secrets, so a forked run would silently score nothing.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROJECT_ID: ${{ vars.PROJECT_ID || 'default' }}
      BRANCH_NAME: ${{ github.ref_name }}
      STUDENT_OVERRIDE: ${{ github.event.inputs.student }}
      FALLBACK_ACTOR: ${{ github.actor }}

    steps:
      - name: Check out the student's work
        uses: actions/checkout@v4
        with:
          path: app

      - name: Resolve student name
        id: who
        run: |
          set -uo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, sys
          from pathlib import Path

          def read_student_yaml():
              """Read name and project from student.yaml if it exists."""
              try:
                  import yaml
              except ImportError:
                  pass
              else:
                  p = Path("app/student.yaml")
                  if p.exists():
                      data = yaml.safe_load(p.read_text()) or {}
                      return (data.get("name") or "").strip(), (data.get("project") or "").strip()
                  return "", ""

              p = Path("app/student.yaml")
              if not p.exists():
                  return "", ""
              name_val = ""
              project_val = ""
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if line.startswith("#") or not line:
                      continue
                  if line.startswith("name:"):
                      name_val = line.split(":", 1)[1].strip().strip("\"'")
                  elif line.startswith("project:"):
                      project_val = line.split(":", 1)[1].strip().strip("\"'")
              return name_val, project_val

          yaml_name, yaml_project = read_student_yaml()

          raw = yaml_name
          source = "student.yaml"
          if not raw:
              raw = (os.environ.get("STUDENT_OVERRIDE") or "").strip()
              source = "workflow_dispatch input"
          if not raw:
              raw = (os.environ.get("BRANCH_NAME") or "").strip()
              source = "branch name"
          if not raw:
              raw = (os.environ.get("FALLBACK_ACTOR") or "").strip()
              source = "github.actor"

          name = raw.lower().replace("/", "-")
          name = re.sub(r"[^a-z0-9._-]+", "-", name).strip("-")

          project = yaml_project or os.environ.get("PROJECT_ID") or ""

          RESERVED = {
              "", "main", "master", "head", "develop",
              "feature-branch-1", "feature-branch-2", "feature-branch-3",
              "feature-branch-4", "test", "temp", "tmp",
          }
          skip = name in RESERVED
          print(f"student={name}")
          print(f"source={source}")
          print(f"skip={'true' if skip else 'false'}")
          if project:
              print(f"project={project}")
          print(f"Resolved student '{name}' from {source}", file=sys.stderr)
          PY

      - name: Skip run for a reserved branch name
        if: steps.who.outputs.skip == 'true'
        run: |
          {
            echo "### Scoring skipped"
            echo
            echo "Your name could not be resolved. Either:"
            echo "- Open \`student.yaml\` and fill in your name, or"
            echo "- Push to a branch named after yourself (e.g. \`ada-lovelace\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The transform scripts live with the API contract they target, so the
      # payload shape and the endpoint schema always change together. Pinned to
      # a tag: a commit on the leaderboard repo must not break 30 students at once.
      - name: Check out the pipeline scripts
        if: steps.who.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.LEADERBOARD_REPO || 'airwallex-community/intro-testing-workshop-leaderboard' }}
          ref: ${{ vars.PIPELINE_REF || 'pipeline-v1' }}
          ssh-key: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}
          path: leaderboard

      - name: Check out the broken versions
        if: steps.who.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUGGY_REPO || 'airwallex-community/intro-testing-workshop-buggy-functions' }}
          ssh-key: ${{ secrets.BUGGY_REPO_DEPLOY_KEY }}
          path: buggy

      - name: Set up Python
        if: steps.who.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        if: steps.who.outputs.skip != 'true'
        run: pip install -r app/requirements.txt

      # Restoring from a snapshot rather than `git checkout` avoids quoting
      # hazards with the colon in the directory names, works on a dirty tree,
      # and can be verified with cmp.
      - name: Snapshot the correct implementations
        if: steps.who.outputs.skip != 'true'
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p .pristine
          while IFS=$'\t' read -r DIR FUNC; do
            DIR="${DIR/:/ -}"
            cp "$DIR/$FUNC.py" ".pristine/$FUNC.py"
          done < <(python3 ../leaderboard/pipeline/functions.py --tsv)
          ls -1 .pristine

      - name: Run tests with coverage
        if: steps.who.outputs.skip != 'true'
        working-directory: app
        run: |
          set -uo pipefail
          python -m pytest --cov --cov-report=json:coverage.json -q || true
          test -f coverage.json

      # Coverage is the live workshop view, so it is posted before the slow part.
      # If break detection dies, the student is still on the board.
      - name: Submit coverage
        if: steps.who.outputs.skip != 'true'
        working-directory: app
        env:
          API_KEY: ${{ secrets.LEADERBOARD_API_KEY }}
          LEADERBOARD_URL: ${{ secrets.LEADERBOARD_URL }}
          STUDENT: ${{ steps.who.outputs.student }}
          PROJECT_ID: ${{ steps.who.outputs.project || env.PROJECT_ID }}
          GITHUB_USERNAME: ${{ github.actor }}
        run: |
          set -uo pipefail
          python3 ../leaderboard/pipeline/extract_coverage.py \
            coverage.json "$STUDENT" "$PROJECT_ID" --allow-missing \
            --github-username "$GITHUB_USERNAME" > coverage_payload.json
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -X POST "$LEADERBOARD_URL/api/v1/coverage" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d @coverage_payload.json

      # Baselines: the student's tests against the CORRECT code, one run per
      # function with flags identical to the break runs so nodeids compare.
      # Only tests that pass here are eligible to score a break.
      - name: Record baselines
        if: steps.who.outputs.skip != 'true'
        working-directory: app
        run: |
          set -uo pipefail
          mkdir -p baseline
          while IFS=$'\t' read -r DIR FUNC; do
            DIR="${DIR/:/ -}"
            echo "::group::baseline $FUNC"
            python -m pytest "$DIR/" \
              -p no:cacheprovider \
              --timeout=15 --timeout-method=thread \
              --report-log="baseline/$FUNC.jsonl" -q || true
            echo "::endgroup::"
          done < <(python3 ../leaderboard/pipeline/functions.py --tsv)

      - name: Run break detection
        if: steps.who.outputs.skip != 'true'
        working-directory: app
        run: |
          set -uo pipefail
          mkdir -p break-results

          # Versions are named after the defect they introduce, so the list comes
          # from the manifest. Nothing here echoes a version name: this log is
          # visible to the student, and the names are the answers.
          CASE=0
          LAST_FUNC=""
          while IFS=$'\t' read -r DIR FUNC VERSION; do
            DIR="${DIR/:/ -}"
            if [ "$FUNC" != "$LAST_FUNC" ]; then CASE=0; LAST_FUNC="$FUNC"; fi
            CASE=$((CASE + 1))
            echo "::group::$FUNC — case $CASE of 5"

            cp "../buggy/functions/$FUNC/$VERSION.py" "$DIR/$FUNC.py"

            python -m pytest "$DIR/" \
              -p no:cacheprovider \
              --timeout=15 --timeout-method=thread \
              --report-log="break-results/$FUNC-$VERSION.jsonl" -q 2>&1 \
              | sed "s/$VERSION/[case $CASE]/g" || true

            cp ".pristine/$FUNC.py" "$DIR/$FUNC.py"
            if ! cmp -s ".pristine/$FUNC.py" "$DIR/$FUNC.py"; then
              echo "::error::failed to restore $DIR/$FUNC.py — aborting"
              exit 1
            fi
            echo "::endgroup::"
          done < <(python3 ../leaderboard/pipeline/functions.py --runs)

      - name: Submit scores
        if: steps.who.outputs.skip != 'true'
        working-directory: app
        env:
          API_KEY: ${{ secrets.LEADERBOARD_API_KEY }}
          LEADERBOARD_URL: ${{ secrets.LEADERBOARD_URL }}
          STUDENT: ${{ steps.who.outputs.student }}
          PROJECT_ID: ${{ steps.who.outputs.project || env.PROJECT_ID }}
          GITHUB_USERNAME: ${{ github.actor }}
        run: |
          set -uo pipefail
          python3 ../leaderboard/pipeline/aggregate_results.py \
            break-results/ "$STUDENT" "$PROJECT_ID" \
            --baseline-dir baseline/ \
            --diagnostics diagnostics.json \
            --github-username "$GITHUB_USERNAME" \
            > scores_payload.json 2> aggregate.log \
            || { echo "::error::aggregate_results failed"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -X POST "$LEADERBOARD_URL/api/v1/scores" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d @scores_payload.json

      - name: Summarise
        if: always() && steps.who.outputs.skip != 'true'
        working-directory: app
        env:
          STUDENT: ${{ steps.who.outputs.student }}
        run: |
          set -uo pipefail
          python3 ../leaderboard/pipeline/summarise.py \
            --student "$STUDENT" \
            --coverage coverage_payload.json \
            --scores scores_payload.json \
            --diagnostics diagnostics.json >> "$GITHUB_STEP_SUMMARY" || \
            echo "Could not build a summary for this run." >> "$GITHUB_STEP_SUMMARY"

      # Coverage only. Artifacts are downloadable by anyone who can read the
      # repo, which includes the students — and break-results filenames,
      # scores_payload.json and diagnostics.json all carry version ids, which are
      # named after the defects. Organisers read the break detail from the API
      # after the reveal instead.
      - name: Upload coverage artifact
        if: always() && steps.who.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.who.outputs.student }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/coverage.json
            app/coverage_payload.json
            app/baseline/
